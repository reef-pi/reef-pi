name: UI Audit
on:
  push:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '**/*.jsx'
      - '**/*.js'
      - '**/*.css'
      - '**/*.scss'
      - '*.json'
      - 'package-lock.json'
      - 'Makefile'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '**/*.jsx'
      - '**/*.js'
      - '**/*.css'
      - '**/*.scss'
      - '*.json'
      - 'package-lock.json'
      - 'Makefile'
      - '.github/workflows/*.yml'

jobs:
  ui-audit:
    name: UI Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - run: make install
      - run: npx playwright install --with-deps chromium
      - run: make go
      - run: make ui
      - run: make ui-audit
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-audit-artifacts
          path: |
            test-results/ui-audit
            playwright-report
            test-results/playwright
          if-no-files-found: ignore
