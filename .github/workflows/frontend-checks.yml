name: Frontend Checks
on:
  push:
    paths:
      - '**/*.jsx'
      - '**/*.js'
      - '**/*.css'
      - '**/*.scss'
      - '*.json'
      - 'package-lock.json'
      - 'Makefile'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '**/*.jsx'
      - '**/*.js'
      - '**/*.css'
      - '**/*.scss'
      - '*.json'
      - 'package-lock.json'
      - 'Makefile'
      - '.github/workflows/*.yml'

jobs:
  jest-standard:
    name: Jest and Standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: sass-lint
        run: npm run sass-lint
      - name: token-diff
        run: npm run token-diff
      - name: contrast-check
        run: npm run contrast-check
      - name: bootstrap-class-check
        run: npm run bootstrap-class-check
      - name: standard
        run: make standard
      - name: jest
        run: npm run jest-update-snapshot

  translations:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Check Translations
        run: npm run translations:chk
