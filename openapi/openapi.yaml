openapi: 3.0.3
info:
  title: reef-pi API
  description: REST API for the reef-pi aquarium controller
  version: 0.0.1
servers:
  - url: /
    description: Local reef-pi instance
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: auth
      description: >
        Session cookie set by POST /auth/signin. Required for all /api/* routes.
  schemas:
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Equipment:
      type: object
      required:
        - name
        - outlet
      properties:
        id:
          type: string
          readOnly: true
          description: Unique identifier for the equipment
        name:
          type: string
          description: Name of the equipment (e.g., "Main Light", "Heater")
        outlet:
          type: string
          description: Identifier of the outlet this equipment is connected to
        on:
          type: boolean
          readOnly: true
          description: Current power state of the equipment
        stay_off_on_boot:
          type: boolean
          description: If true, equipment will not be powered on during boot sequence
        boot_delay:
          type: integer
          description: Seconds to wait after powering on during boot sequence
    EquipmentAction:
      type: object
      required:
        - on
      properties:
        on:
          type: boolean
          description: Desired power state for the equipment
    JournalParameter:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        unit:
          type: string
        description:
          type: string
    JournalEntry:
      type: object
      required:
        - value
      properties:
        value:
          type: number
          format: double
        timestamp:
          type: string
          format: date-time
        comment:
          type: string
    UsageStats:
      type: object
      description: Time-series stats returned by usage endpoints
      properties:
        current:
          type: array
          items: {}
        historical:
          type: array
          items: {}
    TimerJob:
      type: object
      required:
        - name
        - type
        - month
        - week
        - day
        - hour
        - minute
        - second
      properties:
        id:
          type: string
          readOnly: true
          description: Unique identifier for the timer job
        name:
          type: string
          description: Human-readable name for the timer job
        enable:
          type: boolean
          description: Whether this timer job is active
        type:
          type: string
          description: Target subsystem type (equipment, macro, ato, camera, doser, lighting, ph, temperature, reminder)
        month:
          type: string
          description: Cron month field
        week:
          type: string
          description: Cron day-of-week field
        day:
          type: string
          description: Cron day-of-month field
        hour:
          type: string
          description: Cron hour field
        minute:
          type: string
          description: Cron minute field
        second:
          type: string
          description: Cron second field
        target:
          description: JSON payload identifying the target resource (e.g. {\"id\":\"abc\"})
    Macro:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        reversible:
          type: boolean
        steps:
          type: array
          items:
            type: object
            additionalProperties: true
    Light:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        jack:
          type: string
        enable:
          type: boolean
        channels:
          type: object
          description: Map of channel index to channel config
          additionalProperties: true
    ATO:
      type: object
      required:
        - name
        - period
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        inlet:
          type: string
        pump:
          type: string
        period:
          type: integer
          description: Check period in seconds
        debounce:
          type: integer
          description: Debounce duration in seconds
        control:
          type: boolean
        enable:
          type: boolean
        is_macro:
          type: boolean
        disable_on_alert:
          type: boolean
        one_shot:
          type: boolean
        notify:
          type: object
          properties:
            enable:
              type: boolean
            max:
              type: integer
    CameraConfig:
      type: object
      properties:
        enable:
          type: boolean
        image_directory:
          type: string
        capture_flags:
          type: string
        tick_interval:
          type: integer
        upload:
          type: boolean
        motion:
          type: object
          properties:
            enable:
              type: boolean
            url:
              type: string
            width:
              type: integer
            height:
              type: integer
    DoserPump:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        jack:
          type: string
        pin:
          type: integer
        type:
          type: string
          description: Pump type (pwm or stepper)
        regiment:
          type: object
          description: Dosing regiment configuration
          additionalProperties: true
        stepper:
          type: object
          description: Stepper motor configuration (if type is stepper)
          additionalProperties: true
    DosingSchedule:
      type: object
      properties:
        duration:
          type: integer
          description: Duration in seconds
        frequency:
          type: integer
          description: Frequency per day
    PhProbe:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        enable:
          type: boolean
        period:
          type: integer
        analog_input:
          type: string
        control:
          type: boolean
        min:
          type: number
          format: double
        max:
          type: number
          format: double
        hysteresis:
          type: number
          format: double
        upper_eq:
          type: string
        downer_eq:
          type: string
        is_macro:
          type: boolean
        one_shot:
          type: boolean
        transformer:
          type: string
        notify:
          type: object
          additionalProperties: true
        chart:
          type: object
          additionalProperties: true
    PhCalibrationPoint:
      type: object
      required:
        - expected
        - observed
      properties:
        expected:
          type: number
          format: double
        observed:
          type: number
          format: double
    TemperatureController:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        min:
          type: number
          format: double
        max:
          type: number
          format: double
        hysteresis:
          type: number
          format: double
        heater:
          type: string
        cooler:
          type: string
        period:
          type: integer
        control:
          type: boolean
        enable:
          type: boolean
        fail_safe:
          type: boolean
        sensor:
          type: string
        analog_input:
          type: string
        fahrenheit:
          type: boolean
        is_macro:
          type: boolean
        one_shot:
          type: boolean
        notify:
          type: object
          additionalProperties: true
        chart:
          type: object
          additionalProperties: true
    DisplayState:
      type: object
      properties:
        on:
          type: boolean
        brightness:
          type: integer
          description: Brightness level 0-100
    Driver:
      type: object
      required:
        - name
        - type
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        type:
          type: string
        config:
          description: Driver-specific JSON config
        pinmap:
          type: object
          additionalProperties:
            type: array
            items:
              type: integer
        parameters:
          type: object
          additionalProperties: true
    DriverValidationRequest:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        config:
          description: Driver-specific JSON config
        parameters:
          type: object
          additionalProperties: true
    Outlet:
      type: object
      required:
        - name
        - driver
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        pin:
          type: integer
        equipment:
          type: string
        reverse:
          type: boolean
        driver:
          type: string
    Inlet:
      type: object
      required:
        - name
        - driver
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        pin:
          type: integer
        equipment:
          type: string
        reverse:
          type: boolean
        driver:
          type: string
    Jack:
      type: object
      required:
        - name
        - driver
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        pins:
          type: array
          items:
            type: integer
        driver:
          type: string
        reverse:
          type: boolean
    JackControlRequest:
      type: object
      description: Map of pin number to PWM value (0-100)
      additionalProperties:
        type: number
        format: double
    AnalogInput:
      type: object
      required:
        - name
        - driver
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        pin:
          type: integer
        driver:
          type: string
security:
  - sessionAuth: []
paths:
  /api/equipment:
    get:
      operationId: listEquipment
      summary: List all equipment
      tags:
        - Equipment
      responses:
        '200':
          description: List of all equipment successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Equipment'
        '401':
          description: Unauthorized - valid session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: createEquipment
      summary: Create new equipment
      tags:
        - Equipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - outlet
              properties:
                name:
                  type: string
                  description: Name of the equipment
                outlet:
                  type: string
                  description: Outlet identifier
                stay_off_on_boot:
                  type: boolean
                  description: If true, equipment will not be powered on during boot
                boot_delay:
                  type: integer
                  description: Seconds to wait before powering on during boot
      responses:
        '200':
          description: Equipment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipment'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - valid session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/equipment/{id}:
    get:
      operationId: getEquipment
      summary: Get equipment by ID
      tags:
        - Equipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Equipment ID
      responses:
        '200':
          description: Equipment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipment'
        '401':
          description: Unauthorized - valid session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Equipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: updateEquipment
      summary: Update equipment
      tags:
        - Equipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Equipment ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the equipment
                outlet:
                  type: string
                  description: Outlet identifier
                stay_off_on_boot:
                  type: boolean
                  description: If true, equipment will not be powered on during boot
                boot_delay:
                  type: integer
                  description: Seconds to wait before powering on during boot
      responses:
        '200':
          description: Equipment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipment'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - valid session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Equipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteEquipment
      summary: Delete equipment
      tags:
        - Equipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Equipment ID
      responses:
        '200':
          description: Equipment deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - valid session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Equipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/equipment/{id}/control:
    post:
      operationId: controlEquipment
      summary: Control equipment power state
      tags:
        - Equipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Equipment ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentAction'
      responses:
        '200':
          description: Equipment state changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipment'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - valid session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Equipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/timers:
    get:
      operationId: listTimerJobs
      summary: List all timer jobs
      tags:
        - Timers
      responses:
        '200':
          description: List of timer jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimerJob'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: createTimerJob
      summary: Create a new timer job
      tags:
        - Timers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimerJob'
      responses:
        '200':
          description: Timer job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimerJob'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/timers/{id}:
    get:
      operationId: getTimerJob
      summary: Get a timer job by ID
      tags:
        - Timers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Timer job found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimerJob'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Timer job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: updateTimerJob
      summary: Update a timer job
      tags:
        - Timers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimerJob'
      responses:
        '200':
          description: Timer job updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimerJob'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Timer job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteTimerJob
      summary: Delete a timer job
      tags:
        - Timers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Timer job deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Timer job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/journal:
    get:
      operationId: listJournalParameters
      summary: List all journal parameters
      tags: [Journal]
      responses:
        '200':
          description: List of journal parameters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JournalParameter'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: createJournalParameter
      summary: Create a journal parameter
      tags: [Journal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalParameter'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalParameter'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/journal/{id}:
    get:
      operationId: getJournalParameter
      summary: Get a journal parameter by ID
      tags: [Journal]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalParameter'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: updateJournalParameter
      summary: Update a journal parameter
      tags: [Journal]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalParameter'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalParameter'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteJournalParameter
      summary: Delete a journal parameter
      tags: [Journal]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/journal/{id}/record:
    post:
      operationId: recordJournalEntry
      summary: Record a journal entry
      tags: [Journal]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntry'
      responses:
        '200':
          description: Entry recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/journal/{id}/usage:
    get:
      operationId: getJournalUsage
      summary: Get journal usage stats
      tags: [Journal]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usage stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageStats'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/macros:
    get:
      operationId: listMacros
      summary: List all macros
      tags: [Macros]
      responses:
        '200':
          description: List of macros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Macro'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: createMacro
      summary: Create a macro
      tags: [Macros]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Macro'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Macro'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/macros/{id}:
    get:
      operationId: getMacro
      summary: Get a macro by ID
      tags: [Macros]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Macro'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: updateMacro
      summary: Update a macro
      tags: [Macros]
      parameters:
        - name: id
          in: path
          required: true
          schema:
